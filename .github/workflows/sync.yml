name: ado-jira-devinfo-sync

# Two steps, both driven off the same Azure DevOps read:
#   1. sync.mjs        — push PRs/branches/commits into the Jira Development panel
#                        (DevInfo API, 2LO OAuth). Read-only against ADO.
#   2. transitions.mjs — forward-only auto-transition of DP issue status
#                        (In Development / PR Raised / PR Reviewed / Development
#                        Complete) via the Jira REST API (user API token).
# Read-only against ADO (PAT).

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub's reliable floor; may lag to ~10-15 min under load)
  workflow_dispatch: {}       # manual "Run workflow" button

concurrency:
  group: devinfo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync ADO -> Jira DevInfo
        env:
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG: fashion-uk
          ADO_PROJECT: Design_Portal
          ADO_REPO: Design_Portal
          COMPLETED_DAYS: '30'
        run: node sync.mjs
      - name: Auto-transition DP issues (ADO -> Jira workflow)
        if: ${{ env.HAS_JIRA_TOKEN == 'true' }}   # skip cleanly if the transition token isn't set
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG: fashion-uk
          ADO_PROJECT: Design_Portal
          ADO_REPO: Design_Portal
          COMPLETED_DAYS: '30'
        run: node transitions.mjs

